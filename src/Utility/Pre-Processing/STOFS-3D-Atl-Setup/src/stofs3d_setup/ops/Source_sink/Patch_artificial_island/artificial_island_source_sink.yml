# Artificial-island source/sink corrections.
#
# This file owns only the temporary pre-relocation source suppression and the
# post-generation artificial-island source/sink operations. USGS corrections
# and generic region zeroing are configured in their owning modules.

# Sources at these original-grid locations retain their columns but receive
# zero flow before relocation. This temporary step is to be removed when the
# island workflow is fully decoupled from relocation.
remove_source_locations_in_artificial_island:
  - name: "Buffalo Bluff"
    x: -81.683455
    y: 29.58590625

  - name: "Turkey"
    x: -79.82117533
    y: 33.12041400

  - name: "Buffalo Bluff"
    x: -81.683455
    y: 29.58590625

  - name: "Clyo"
    x: -81.2687900
    y: 32.5287988

  - name: "Moultrie"
    x: -79.9726690
    y: 33.2072897

# Create artificial-island sources or sinks at the nearest main-grid element.
# Nearby original forcing supplies the template; entries with use_usgs_obs
# replace supported records and retain the template elsewhere.
force_source_sink_locations:
  - name: "Wando"
    source_sink_type: "source"
    x: -79.6996536667
    y: 32.9802923333
    max_search_radius_m: 1500.0
    allow_negative_sink: false
    use_usgs_obs: false

  - name: "Turkey"
    source_sink_type: "source"
    x: -79.82117533
    y: 33.12041400
    max_search_radius_m: 500.0
    allow_negative_sink: false
    use_usgs_obs: true

  - name: "Buffalo Bluff"
    source_sink_type: "source"
    x: -81.683455
    y: 29.58590625
    max_search_radius_m: 500.0
    allow_negative_sink: true
    use_usgs_obs: true

  - name: "Dunns Creek"
    source_sink_type: "source"
    x: -81.630815333
    y: 29.588973333
    max_search_radius_m: 500.0
    allow_negative_sink: true
    use_usgs_obs: true

# Add -1000 m3/s at the nearest element for the complete model period.
large_constant_sink_artificial_island_locations:
  - name: "Buffalo Bluff"
    x: -81.683949
    y: 29.584587
